<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Eye</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #222;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background-color: #000000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .bottom-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <h2 style="margin: 0; font-size: 20px; font-weight: bold;">Z-Eye</h2>
        <div style="display: flex; gap: 15px;">
            <span>⚡</span>
            <span>✨</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main style="padding-bottom: 70px;">
        <div style="display: flex; gap: 10px; padding: 10px 16px; overflow-x: auto;">
            <button style="background: #0095f6; color: #fff; border: none; padding: 6px 14px; border-radius: 20px;">All Media</button>
            <button style="background: #262626; color: #fff; border: none; padding: 6px 14px; border-radius: 20px;">Photos</button>
            <button style="background: #262626; color: #fff; border: none; padding: 6px 14px; border-radius: 20px;">Short Videos</button>
        </div>

        <div id="feed-container" style="padding: 20px; text-align: center; color: #666;">
            <p>No media posts yet.</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#">🏠 Feed</a>
        <a href="#">🔍 Explore</a>
        <a href="#">➕ Post</a>
        <a href="#">✨ AI</a>
        <a href="#">👤 Profile</a>
    </nav>

    <script type="module" src="api.ts"></script>
</body>
</html>
