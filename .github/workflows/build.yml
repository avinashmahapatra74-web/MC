name: Build Z-eye Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        if [ -f "z-eye.zip" ]; then
          unzip -o z-eye.zip
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --force

    - name: Build Web App
      run: npx vite build

    - name: Convert to Android & Fix Duplicate Classes
      run: |
        npm install --save @capacitor/core @capacitor/cli @capacitor/android --force
        rm -f capacitor.config.ts
        echo '{"appId": "com.zeye.app", "appName": "Z-eye", "webDir": "dist"}' > capacitor.config.json
        npx cap add android
        npx cap sync android
        echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
        echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: Z-Eye-App-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
