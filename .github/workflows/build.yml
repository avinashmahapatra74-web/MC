name: Build Z-eye Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        if [ -f "z-eye.zip" ]; then
          unzip -o z-eye.zip
        fi

    - name: Inject Studio Camera & Modern Ecosystem
      run: |
        # 1. Inject Camera Studio Component
        cat << 'EOF' > src/components/StudioCameraViewport.tsx
        import React, { useState, useRef, useEffect } from 'react';
        import { X, Zap, RefreshCw, Volume2, Gauge, Sparkles, Timer, Layers, Disc } from 'lucide-react';

        const DURATION_CYCLE = [15, 30, 60, 90, 180, 300]; // up to 5 minutes
        const TEMPO_OPTIONS = [0.3, 0.5, 1.0, 2.0, 3.0];
        const MODES = ['Frame', 'Moment', 'Flux Clip', 'Airwave'];

        export const StudioCameraViewport: React.FC<{ onClose: () => void }> = ({ onClose }) => {
          const [durationLimit, setDurationLimit] = useState<number>(300);
          const [tempo, setTempo] = useState<number>(1.0);
          const [selectedMode, setSelectedMode] = useState<string>('Flux Clip');
          const [isRecording, setIsRecording] = useState<boolean>(false);
          const [seconds, setSeconds] = useState<number>(0);
          const [torch, setTorch] = useState<boolean>(false);
          const [stream, setStream] = useState<MediaStream | null>(null);
          const timerRef = useRef<any>(null);

          useEffect(() => {
            navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' }, audio: true })
              .then(setStream)
              .catch(() => {});
            return () => {
              if (stream) stream.getTracks().forEach((t) => t.stop());
              clearInterval(timerRef.current);
            };
          }, []);

          const toggleRecord = () => {
            if (isRecording) {
              clearInterval(timerRef.current);
              setIsRecording(false);
              setSeconds(0);
            } else {
              setIsRecording(true);
              timerRef.current = setInterval(() => {
                setSeconds((s) => {
                  if (s + 1 >= durationLimit) {
                    toggleRecord();
                    return durationLimit;
                  }
                  return s + 1;
                });
              }, 1000);
            }
          };

          return (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between overflow-hidden select-none font-['Plus_Jakarta_Sans']">
              <div className="absolute inset-0 z-0 flex items-center justify-center">
                {stream ? (
                  <video autoPlay playsInline muted ref={(n) => { if (n && stream) n.srcObject = stream; }} className="w-full h-full object-cover" />
                ) : (
                  <div className="text-gray-500 font-mono text-xs">Connecting Camera Hardware (60FPS)...</div>
                )}
              </div>

              {/* Top Bar */}
              <div className="relative z-20 px-4 pt-10 pb-3 flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent">
                <button onClick={onClose} className="w-10 h-10 rounded-full bg-black/40 border border-white/10 flex items-center justify-center text-white">
                  <X className="w-5 h-5" />
                </button>
                <div className="px-3.5 py-1.5 rounded-full bg-black/60 border border-cyan-400/40 text-cyan-300 text-xs font-bold flex items-center space-x-2 shadow-lg">
                  <Disc className="w-3.5 h-3.5 animate-spin" />
                  <span>Acoustic Sync</span>
                </div>
                <button onClick={() => setTorch(!torch)} className={`w-10 h-10 rounded-full border border-white/10 flex items-center justify-center ${torch ? 'bg-yellow-400 text-black' : 'bg-black/40 text-white'}`}>
                  <Zap className="w-4 h-4" />
                </button>
              </div>

              {/* Left Toolkit */}
              <div className="relative z-20 ml-3 my-auto w-11 py-3.5 rounded-full bg-black/45 backdrop-blur-lg border border-white/10 flex flex-col items-center space-y-3.5">
                <button onClick={() => setDurationLimit(DURATION_CYCLE[(DURATION_CYCLE.indexOf(durationLimit) + 1) % DURATION_CYCLE.length])} className="w-8 h-8 rounded-full bg-white/10 text-[10px] font-mono font-bold text-cyan-400 border border-cyan-400/40">
                  {durationLimit >= 60 ? `${durationLimit / 60}m` : `${durationLimit}s`}
                </button>
                <button onClick={() => setTempo(TEMPO_OPTIONS[(TEMPO_OPTIONS.indexOf(tempo) + 1) % TEMPO_OPTIONS.length])} className="w-8 h-8 rounded-full text-[9px] font-mono font-bold text-white flex flex-col items-center justify-center">
                  <Gauge className="w-3.5 h-3.5 mb-0.5" />
                  <span>{tempo}x</span>
                </button>
                <button className="w-8 h-8 rounded-full text-white/80 hover:text-white flex items-center justify-center">
                  <Sparkles className="w-4 h-4 text-purple-400" />
                </button>
                <button className="w-8 h-8 rounded-full text-white/80 hover:text-white flex items-center justify-center">
                  <Layers className="w-4 h-4 text-emerald-400" />
                </button>
              </div>

              {/* Bottom Shutter & Carousel */}
              <div className="relative z-20 pb-8 flex flex-col items-center bg-gradient-to-t from-black/95 to-transparent">
                <div className="relative w-20 h-20 flex items-center justify-center mb-5">
                  <button onClick={toggleRecord} className={`w-14 h-14 rounded-full transition-all flex items-center justify-center ${isRecording ? 'bg-rose-600 rounded-xl scale-90' : 'bg-gradient-to-tr from-cyan-400 to-purple-600'}`}>
                    {isRecording && <span className="text-[10px] font-mono text-white font-bold">{seconds}s</span>}
                  </button>
                </div>
                <div className="flex items-center space-x-6 overflow-x-auto px-6 py-1 scrollbar-none">
                  {MODES.map((m) => (
                    <button key={m} onClick={() => setSelectedMode(m)} className={`text-xs uppercase font-extrabold tracking-widest ${selectedMode === m ? 'text-cyan-400 scale-105' : 'text-gray-400'}`}>
                      {m}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        };
        EOF

        # 2. Inject App.tsx Hooking Studio Camera
        cat << 'EOF' > src/App.tsx
        import React, { useState, useEffect } from 'react';
        import { AuthProvider, useAuth } from './context/AuthContext';
        import { SyncProvider } from './context/SyncContext';
        import { Post } from './types';
        import { api } from './services/api';
        import { Header } from './components/Header';
        import { Navigation, NavTab } from './components/Navigation';
        import { FeedCard } from './components/FeedCard';
        import { CommentsSheet } from './components/CommentsSheet';
        import { ProfileView } from './components/ProfileView';
        import { DeviceLockModal } from './components/DeviceLockModal';
        import { DeviceOptimizerModal } from './components/DeviceOptimizerModal';
        import { BigFixAIDashboard } from './components/BigFixAIDashboard';
        import { StudioCameraViewport } from './components/StudioCameraViewport';
        import { Compass } from 'lucide-react';

        function MainApp() {
          const { currentUser } = useAuth();
          const [currentTab, setCurrentTab] = useState<NavTab>('feed');
          const [selectedTag, setSelectedTag] = useState<string>('All');
          const [posts, setPosts] = useState<Post[]>([]);
          const [activeCommentsPost, setActiveCommentsPost] = useState<Post | null>(null);
          const [isCameraOpen, setIsCameraOpen] = useState<boolean>(false);
          const [isDeviceModalOpen, setIsDeviceModalOpen] = useState<boolean>(false);
          const [isOptimizerModalOpen, setIsOptimizerModalOpen] = useState<boolean>(false);

          const loadFeed = async () => {
            const res = await api.getFeed(currentUser?.id || 'u-apex', selectedTag);
            if (res && res.posts) setPosts(res.posts);
          };

          useEffect(() => { loadFeed(); }, [selectedTag]);

          const handleNavSelect = (tab: NavTab) => {
            if (tab === 'create') setIsCameraOpen(true);
            else {
              setCurrentTab(tab);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          };

          return (
            <div className="min-h-screen bg-black text-[#F5F7FA] font-['Plus_Jakarta_Sans'] flex flex-col w-full selection:bg-[#00E5FF]/20">
              <Header
                selectedTag={selectedTag}
                onSelectTag={setSelectedTag}
                onOpenDeviceManager={() => setIsDeviceModalOpen(true)}
                onOpenBigFixAI={() => setCurrentTab('ai')}
                onOpenOptimizer={() => setIsOptimizerModalOpen(true)}
              />

              <main className="flex-1 w-full max-w-lg mx-auto pb-24 px-3 pt-2">
                {currentTab === 'feed' && (
                  <div className="space-y-4">
                    {posts.map((post) => (
                      <FeedCard key={post.id} post={post} onLikeToggle={() => {}} onOpenComments={(p) => setActiveCommentsPost(p)} onOpenReport={() => {}} />
                    ))}
                  </div>
                )}

                {currentTab === 'explore' && (
                  <div className="space-y-3">
                    <div className="flex items-center space-x-2">
                      <Compass className="w-5 h-5 text-[#00E5FF]" />
                      <h3 className="font-extrabold text-sm text-white">Explore Trending AMOLED Media</h3>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      {posts.map((p, idx) => (
                        <div key={`${p.id}-${idx}`} onClick={() => setActiveCommentsPost(p)} className="relative aspect-square rounded-xl overflow-hidden bg-[#0B0D10] border border-[#14171C]">
                          {p.postType === 'video' ? (
                            <video src={p.media[0]?.url} className="w-full h-full object-cover" muted playsInline />
                          ) : (
                            <img src={p.media[0]?.url} alt="" className="w-full h-full object-cover" />
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {currentTab === 'ai' && <BigFixAIDashboard />}
                {currentTab === 'profile' && <ProfileView onOpenDeviceManager={() => setIsDeviceModalOpen(true)} onPostSelect={(p) => setActiveCommentsPost(p)} />}
              </main>

              <Navigation currentTab={currentTab} onSelectTab={handleNavSelect} />

              {isCameraOpen && <StudioCameraViewport onClose={() => setIsCameraOpen(false)} />}
              <CommentsSheet post={activeCommentsPost} onClose={() => setActiveCommentsPost(null)} onCommentAdded={loadFeed} />
              <DeviceLockModal isOpen={isDeviceModalOpen} onClose={() => setIsDeviceModalOpen(false)} />
              <DeviceOptimizerModal isOpen={isOptimizerModalOpen} onClose={() => setIsOptimizerModalOpen(false)} currentPlatformMode="android" onPlatformChange={() => {}} />
            </div>
          );
        }

        export default function App() {
          return (
            <AuthProvider>
              <SyncProvider>
                <MainApp />
              </SyncProvider>
            </AuthProvider>
          );
        }
        EOF

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --force

    - name: Build Web App
      run: npx vite build

    - name: Convert to Android & Build Clean APK
      run: |
        npm install --save @capacitor/core @capacitor/cli @capacitor/android --force
        rm -f capacitor.config.ts
        echo '{"appId": "com.zeye.app", "appName": "Z-eye", "webDir": "dist"}' > capacitor.config.json
        npx cap add android
        npx cap sync android
        echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
        echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: Z-Eye-App-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
